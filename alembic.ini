# Dev-time Alembic CLI configuration. The container does NOT use this file:
# the store builds its own Config at boot (relay/store.py _upgrade_schema).
# This file serves `make migrate` and `uv run alembic revision --autogenerate
# -m "..."` against the local ./relay.db.

[alembic]
script_location = relay/migrations
prepend_sys_path = .
sqlalchemy.url = sqlite:///./relay.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
