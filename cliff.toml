[git]
commit_parsers = [
    { message = "^feat(\\(.*\\))?:", group = "Features" },
    { message = "^fix(\\(.*\\))?:", group = "Bug Fixes" },
    { message = "^perf(\\(.*\\))?:", group = "Performance Improvements" },
    { message = "^refactor(\\(.*\\))?:", group = "Code Refactoring" },
    { message = "^docs(\\(.*\\))?:", group = "Documentation" },
    { message = "^style(\\(.*\\))?:", group = "Style" },
    { message = "^test(\\(.*\\))?:", group = "Tests" },
    { message = "^chore(\\(.*\\))?:", group = "Maintenance" },
    { message = "^revert(\\(.*\\))?:", group = "Reverts" },
    { message = ".*", group = "Other" },
]

[changelog]
header = "# Changelog"
body = "{% if commits %}{% for group, commits in commits.grouped_items() %}\n### {{ group }}\n{% for commit in commits %}\n- {{ commit.message }}\n{% endfor %}\n{% endfor %}{% endif %}"
footer = "## Summary\nGenerated by git-cliff"

[changelog.commit]
order = [
    { group = "Features", order = 1 },
    { group = "Bug Fixes", order = 2 },
    { group = "Performance Improvements", order = 3 },
    { group = "Code Refactoring", order = 4 },
    { group = "Documentation", order = 5 },
    { group = "Style", order = 6 },
    { group = "Tests", order = 7 },
    { group = "Maintenance", order = 8 },
    { group = "Reverts", order = 9 },
    { group = "Other", order = 10 },
]
