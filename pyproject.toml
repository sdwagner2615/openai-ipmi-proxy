[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "relay"
description = "Generic resource-management proxy: power-aware, session-queued traffic proxy with scale-to-zero."
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "aiosqlite>=0.20",
    "croniter>=2.0",
    "websockets>=12",
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]

[project.scripts]
relay = "relay.main:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.setuptools.packages.find]
include = ["relay*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Query/Path/Depends are effectively immutable call defaults.
extend-immutable-calls = ["fastapi.Query", "fastapi.Path", "fastapi.Depends"]

[tool.mypy]
files = ["relay"]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = ["unit", "e2e"]
asyncio_mode = "auto"
